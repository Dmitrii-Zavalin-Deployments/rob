<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rob — Autonomous AI Engine</title>
    <style>
        body { 
            font-family: "Segoe UI", Arial, sans-serif; 
            background: #f8f9fa; 
            color: #1a1a1a; 
            padding: 40px; 
            margin: 0; 
            line-height: 1.55;
        }
        .wrapper { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }
        
        .header-block { 
            text-align: center; 
            margin-bottom: 10px; 
        }
        h1 { 
            margin: 0; 
            font-size: 32px; 
            font-weight: 600; 
            color: #003366; 
        }
        .subtitle {
            font-size: 16px;
            color: #555;
            margin: 6px 0 0 0;
            letter-spacing: 0.3px;
        }
        
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: 1.2fr 0.8fr; 
            gap: 25px; 
            align-items: flex-start;
        }
        @media (max-width: 950px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .card { 
            background: #ffffff; 
            border: 1px solid #d0d7de; 
            padding: 24px; 
            border-radius: 6px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
            box-sizing: border-box;
        }
        .card:last-child {
            margin-bottom: 0;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2 { 
            font-size: 18px; 
            font-weight: 600; 
            color: #003366; 
            margin-top: 0; 
            margin-bottom: 15px; 
        }
        
        input[type="text"] { 
            width: 100%; 
            background: #ffffff; 
            color: #1a1a1a; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            padding: 10px 14px; 
            box-sizing: border-box; 
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 14px;
            margin-bottom: 10px;
        }
        input[type="text"]:focus {
            border-color: #003366;
            outline: none;
        }
        
        .btn { 
            background: #003366; 
            color: #fff; 
            padding: 9px 18px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px; 
            transition: background 0.2s; 
        }
        .btn:hover { background: #002244; }
        .btn:disabled { background: #e1e4e8; color: #8c959f; cursor: not-allowed; }

        #terminal-card {
            display: flex;
            flex-direction: column;
        }

        #log-terminal { 
            background: #0d1117; 
            color: #33ff33; 
            padding: 15px; 
            font-family: monospace; 
            height: 380px; 
            max-height: 380px;
            overflow-y: scroll; 
            border-radius: 4px; 
            font-size: 13px; 
            border: 1px solid #30363d; 
            line-height: 1.4; 
            white-space: pre-wrap;
            word-break: break-all;
            box-sizing: border-box;
        }
        #chat-history { 
            background: #fdfdfd; 
            color: #1a1a1a; 
            height: 480px; 
            overflow-y: auto;
            padding: 15px;
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            font-family: "Segoe UI", Arial, sans-serif; 
            border-radius: 4px;
            border: 1px solid #d0d7de;
            box-sizing: border-box;
        }
        .chat-msg { padding: 10px 14px; border-radius: 6px; max-width: 88%; word-wrap: break-word; font-size: 14px; }
        .chat-user { background: #003366; color: white; align-self: flex-end; }
        .chat-rob { background: #f1f3f5; border: 1px solid #d0d7de; align-self: flex-start; color: #1a1a1a; }
        
        .status-badge { display: inline-block; padding: 4px 10px; font-size: 12px; border-radius: 4px; font-weight: 600; background: #003366; color: white; margin-bottom: 12px; }
    </style>
    <!-- Import official local module tree -->
    <script type="module">
        import * as webllm from "./vendor/index.js";
        window.webllm = webllm;
    </script>
</head>
<body>
    <div class="wrapper">
        <div class="header-block">
            <h1>Rob</h1>
            <p class="subtitle">Autonomous AI Engine</p>
        </div>

        <div class="dashboard-grid">
            <!-- LEFT COLUMN: Chat Interface -->
            <div>
                <div class="card" style="display: flex; flex-direction: column; box-sizing: border-box;">
                    <h2>💬 Talk to Rob</h2>
                    
                    <div id="chat-history">
                        <div class="chat-msg chat-rob">Rob: Initializing local engine... Please wait.</div>
                    </div>

                    <div style="margin-top: 15px; display: flex; gap: 8px;">
                        <input type="text" id="chat-input" placeholder="Initializing engine..." disabled style="margin-bottom: 0;" onkeydown="if(event.key==='Enter') sendChatMessage()">
                        <button id="send-btn" class="btn" disabled onclick="sendChatMessage()">Send 💬</button>
                    </div>
                    <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 12px; color: #555;">Want to export history?</span>
                        <button class="btn" style="background: #e1e4e8; color: #1a1a1a; border: 1px solid #d0d7de; font-size: 12px; padding: 5px 10px;" onclick="downloadChatAsTxt()">📥 Download Chat as TXT</button>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Knowledge Base & Terminal Monitor -->
            <div class="right-column">
                <!-- Knowledge Base Panel -->
                <div class="card">
                    <h2>📁 Knowledge Base</h2>
                    <div>
                        <span id="rag-status" class="status-badge">Scanning Corpus...</span>
                    </div>
                    <p style="font-size:13px; color:#555; margin-top:4px; margin-bottom:15px;">Automatically connects reference files to inform responses without external data sharing.</p>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn" style="background: #003366; flex: 1;" onclick="loadGeneralTrainingCorpus()">🔄 Refresh Knowledge</button>
                        <button class="btn" style="background: #a61c1c; flex: 1;" onclick="wipeWebGPUCache()">🧹 Clear Local Memory</button>
                    </div>
                </div>

                <!-- Terminal Output Monitor -->
                <div class="card" id="terminal-card">
                    <h2>📡 System Terminal</h2>
                    <div id="log-terminal">System Initializing...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let engine = null;
        let isBooting = false;
        let generalKnowledgeCorpus = [];
        const selectedModel = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";

        function logTerm(message) {
            const term = document.getElementById('log-terminal');
            if (term) {
                const timestamp = new Date().toLocaleTimeString();
                term.innerText += `\n[${timestamp}] ${message}`;
                term.scrollTop = term.scrollHeight;
            }
            console.log(`[Rob Terminal] ${message}`);
        }

        function getBasePath() {
            let path = window.location.pathname;
            if (!path.endsWith('/')) {
                path = path.substring(0, path.lastIndexOf('/') + 1);
            }
            return window.location.origin + path;
        }

        async function wipeWebGPUCache() {
            logTerm("🧹 Purging local memory and cache...");
            localStorage.clear();
            try {
                if (window.indexedDB && indexedDB.databases) {
                    const dbs = await indexedDB.databases();
                    for (let db of dbs) {
                        if (db.name) {
                            indexedDB.deleteDatabase(db.name);
                            logTerm(`🗑️ Deleted local database: ${db.name}`);
                        }
                    }
                } else {
                    indexedDB.deleteDatabase("webllm/");
                    indexedDB.deleteDatabase("mlc-chat");
                }
                logTerm("✅ Local memory cleared! Reloading page...");
                setTimeout(() => window.location.reload(), 1200);
            } catch (err) {
                logTerm(`⚠️ Error clearing memory: ${err.message}`);
                window.location.reload();
            }
        }

        async function loadGeneralTrainingCorpus() {
            const badge = document.getElementById('rag-status');
            logTerm("🤖 Initiating knowledge base scan...");

            try {
                const basePath = getBasePath();
                const manifestUrl = `${basePath}general_training/manifest.json?v=${Date.now()}`;
                logTerm(`🔍 Fetching manifest from: ${manifestUrl}`);

                const manifestRes = await fetch(manifestUrl);
                if (!manifestRes.ok) throw new Error(`manifest.json HTTP status ${manifestRes.status}`);
                
                const filenames = await manifestRes.json();
                logTerm(`📄 Manifest parsed. Found ${filenames.length} file entries.`);
                
                generalKnowledgeCorpus = [];
                for (let filename of filenames) {
                    const fileUrl = `${basePath}general_training/${filename}?v=${Date.now()}`;
                    logTerm(`📥 Loading reference document: ${filename}`);
                    
                    const fileRes = await fetch(fileUrl);
                    if (fileRes.ok) {
                        const content = await fileRes.text();
                        generalKnowledgeCorpus.push({ name: filename, content: content });
                        logTerm(`✅ Loaded "${filename}" successfully (${content.length} characters).`);
                    } else {
                        logTerm(`❌ Failed to load file "${filename}" (HTTP ${fileRes.status})`);
                    }
                }

                if (badge) {
                    badge.style.background = "#003366";
                    badge.innerText = `🟢 Knowledge Base Active (${generalKnowledgeCorpus.length} Document Loaded)`;
                }
                logTerm(`🎉 Knowledge base synchronization complete.`);
            } catch (err) {
                logTerm(`🔴 Knowledge Base Sync Error: ${err.message}`);
                if (badge) {
                    badge.style.background = "#b7791f";
                    badge.innerText = `⚠️ Knowledge Sync Failed`;
                }
            }
        }

        function downloadChatAsTxt() {
            const historyDiv = document.getElementById('chat-history');
            const msgs = historyDiv.getElementsByClassName('chat-msg');
            if (msgs.length <= 1) {
                alert("No chat conversation to export yet!");
                return;
            }

            let chatText = "--- Rob AI Engine Chat Export ---\nGenerated: " + new Date().toISOString() + "\n\n";
            for (let msg of msgs) {
                chatText += msg.innerText + "\n\n";
            }

            const blob = new Blob([chatText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `rob_chat_export_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            logTerm("📥 Conversation successfully exported as TXT.");
        }

        async function bootRobEngine() {
            if (isBooting) return;
            isBooting = true;

            const history = document.getElementById('chat-history');
            const inputField = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');

            logTerm("🚀 Engine boot sequence initiated...");
            await loadGeneralTrainingCorpus();

            if (engine) {
                logTerm("🧹 Unloading previous engine instance...");
                try { await engine.unload(); } catch(e) {}
                engine = null;
            }

            logTerm(`⚡ Initializing local execution kernel for model: ${selectedModel}`);
            history.innerHTML = `<div class="chat-msg chat-rob">Rob: Initializing local AI engine... Please wait.</div>`;
            history.scrollTop = history.scrollHeight;
            
            try {
                if (!window.webllm || !window.webllm.CreateMLCEngine) {
                    throw new Error("Local WebLLM module failed to load from ./vendor/index.js.");
                }

                engine = await window.webllm.CreateMLCEngine(selectedModel, {
                    initProgressCallback: (progress) => {
                        const pct = Math.round(progress.progress * 100);
                        logTerm(`⚡ Engine Loading [${pct}%]: ${progress.text}`);
                    }
                });

                // Reset KV-cache state machine to ensure full initialization before accepting user messages
                if (engine.resetChat) {
                    await engine.resetChat();
                }

                history.innerHTML = `<div class="chat-msg chat-rob">Rob: Hello! I am online and ready to assist you.</div>`;
                history.scrollTop = history.scrollHeight;
                
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.placeholder = "Type a message to Rob...";
                logTerm("🟢 Rob is fully online with active local knowledge!");
                isBooting = false;

            } catch (err) {
                logTerm(`🔴 Engine Error: ${err.message}`);
                history.innerHTML += `<div class="chat-msg chat-rob" style="color: #a61c1c;">🔴 Engine Error: ${err.message}.</div>`;
                history.scrollTop = history.scrollHeight;
                isBooting = false;
            }
        }

        async function sendChatMessage() {
            const inputField = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const history = document.getElementById('chat-history');
            const userText = inputField.value.trim();

            if (!userText || !engine) return;

            inputField.disabled = true;
            sendBtn.disabled = true;

            logTerm(`💬 User query submitted: "${userText}"`);
            history.innerHTML += `<div class="chat-msg chat-user"><b>You:</b> ${userText}</div>`;
            inputField.value = '';
            history.scrollTop = history.scrollHeight;

            let assembledTxt = "";
            for (let doc of generalKnowledgeCorpus) {
                assembledTxt += `\n[File: ${doc.name}]\n${doc.content}\n`;
            }

            const messages = [
                { 
                    role: "system", 
                    content: `You are Rob, an autonomous sovereign AI created by Dmitrii Zavalin. Answer questions accurately using only the provided reference knowledge base.\n\n--- REFERENCE KNOWLEDGE BASE ---\n${assembledTxt}` 
                },
                { 
                    role: "user", 
                    content: userText 
                }
            ];

            logTerm(`📝 Messages payload assembled. Executing real-time streaming response...`);

            const replyDiv = document.createElement("div");
            replyDiv.className = "chat-msg chat-rob";
            replyDiv.innerHTML = "Rob: <i>Thinking...</i>";
            history.appendChild(replyDiv);
            history.scrollTop = history.scrollHeight;

            try {
                const asyncIterator = await engine.chat.completions.create({
                    messages,
                    temperature: 0.1,
                    max_tokens: 128,
                    stream: true
                });

                let fullReply = "";
                for await (const chunk of asyncIterator) {
                    const delta = chunk.choices[0]?.delta?.content || "";
                    fullReply += delta;
                    replyDiv.innerText = "Rob: " + fullReply;
                    history.scrollTop = history.scrollHeight;
                }

                logTerm(`✅ Response completed successfully (${fullReply.length} characters).`);
            } catch (err) {
                logTerm(`🔴 Execution Error: ${err.message}`);
                replyDiv.innerText = "Rob Error: " + err.message;
            } finally {
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            bootRobEngine();
        });
    </script>
</body>
</html>
