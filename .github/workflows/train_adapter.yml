name: Rob's Adapter Training Engine

on:
  workflow_dispatch:
    inputs:
      training_text:
        description: 'Private business templates/materials for Rob'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit and Sync Autonomous Vendor Engine
        run: |
          if [ ! -f "vendor/index.js" ]; then
            echo "🤖 Rob: Vendor engine missing. Pulling release tarball from sovereign repository assets..."
            mkdir -p temp_tgz vendor
            
            # Download directly from sovereign release assets
            curl -L -o temp_tgz/web-llm.tgz "https://github.com/${{ github.repository }}/releases/download/v1.0-base-model/web-llm-0.2.86.tgz"
            
            # Unpack tarball
            tar -xzf temp_tgz/web-llm.tgz -C temp_tgz
            
            # Move compiled runtime library into vendor folder
            cp -r temp_tgz/package/lib/* vendor/
            
            # Clean up TypeScript declarations and map files to save space
            find vendor -name "*.d.ts" -delete
            find vendor -name "*.map" -delete
            rm -rf temp_tgz
            
            # Configure git identity for automated sync
            git config --global user.name "Rob Autonomous Agent"
            git config --global user.email "rob@sovereign.local"
            
            git add vendor/
            git commit -m "chore(vendor): auto-sync clean web-llm 0.2.86 release tree"
            git push origin main
            echo "🟢 Rob: Official web-llm package extracted and pushed to repository!"
          else
            echo "🟢 Rob: Vendor engine verified and locked in repository."
          fi

      - name: Fetch Sovereign Base Model from Release Assets
        run: |
          mkdir -p ./base_model_cache
          echo "🤖 Rob: Downloading sovereign base model archive from repository release assets..."
          curl -L -o qwen_base.tar.gz "https://github.com/${{ github.repository }}/releases/download/v1.0-base-model/qwen_base.tar.gz"
          tar -xzf qwen_base.tar.gz -C ./base_model_cache
          echo "🟢 Base model secured locally from sovereign storage!"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Compute Libraries
        run: pip install transformers torch accelerate peft

      - name: Execute CPU Adapter Training
        env:
          TRAIN_PAYLOAD: ${{ github.event.inputs.training_text }}
        run: |
          cat << 'EOF' > run_train.py
          import os, base64, torch, glob
          from transformers import AutoModelForCausalLM, AutoTokenizer
          from peft import LoraConfig, get_peft_model

          print("🤖 Rob: Initializing sovereign base model from local cache...")
          model_id = "./base_model_cache"
          tok = AutoTokenizer.from_pretrained(model_id)
          base = AutoModelForCausalLM.from_pretrained(model_id, torch_dtype=torch.float32)

          print("🤖 Rob: Configuring custom LoRA personal appendix...")
          cfg = LoraConfig(r=4, lora_alpha=8, target_modules=["q_proj", "v_proj"], task_type="CAUSAL_LM")
          model = get_peft_model(base, cfg)

          # Aggregate manual payload + all files inside general_training/ folder
          combined_text = os.environ.get("TRAIN_PAYLOAD", "") + "\n\n"
          
          general_files = glob.glob("general_training/*.txt") + glob.glob("general_training/*.md")
          for file_path in general_files:
              with open(file_path, "r", encoding="utf-8") as f:
                  print(f"📄 Ingesting shared general training file: {file_path}")
                  combined_text += f"\n{f.read()}\n"

          inputs = tok(combined_text, return_tensors="pt")

          print("🤖 Rob: Starting low-memory CPU optimization pass...")
          opt = torch.optim.AdamW(model.parameters(), lr=5e-4)
          model.train()
          for epoch in range(3):
              opt.zero_grad()
              loss = model(**inputs, labels=inputs["input_ids"]).loss
              loss.backward()
              opt.step()
              print(f"Epoch {epoch+1}/3 complete. Loss: {loss.item():.4f}")

          print("🤖 Rob: Packaging custom weights...")
          model.save_pretrained("./temp_lora")
          
          with open("./temp_lora/adapter_model.safetensors", "rb") as f:
              encoded_weights = base64.b64encode(f.read()).decode('utf-8')
              print("---START_WEIGHT_STREAM---")
              print(encoded_weights)
              print("---END_WEIGHT_STREAM---")
          print("🤖 Rob: Training complete! Stream ready.")
          EOF
          python3 run_train.py